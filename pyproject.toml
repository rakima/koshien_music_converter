[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koshien-music-converter"
version = "0.1.0"
description = "MP3を甲子園の応援風アレンジへ変換するローカルGUIツール"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
    "demucs>=4.1.0,<5",
    "librosa>=0.11,<1",
    "pretty-midi>=0.2.11,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
